name: Render Content Studio Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      contentKey:
        description: 'Content Key du contenu à rendre'
        required: true
        type: string

concurrency:
  group: render-${{ github.event.client_payload.contentKey || github.event.inputs.contentKey || 'general' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Remotion Video Render & Storage Upload
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TARGET_KEY="${{ github.event.client_payload.contentKey || github.event.inputs.contentKey }}"
          echo "🎬 Starting video render for contentKey: $TARGET_KEY"
          npx tsx scripts/render-content-item.ts "$TARGET_KEY"
